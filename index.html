<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SORA">
<meta name="theme-color" content="#1a1708">
<title>SORA — Gestion Commerciale EI</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%238B6914'/%3E%3Cpath d='M90 28L97 58L130 50L108 73L125 110L90 95L55 110L72 73L50 50L83 58Z' fill='white' opacity='.95'/%3E%3Ccircle cx='90' cy='90' r='15' fill='%23C9A96E'/%3E%3C/svg%3E">
<style>
:root{
  --gold:#C9A96E;--gold-d:#8B6914;--gold-bg:#FFFBF0;--gold-l:#FDF3DC;
  --bg:#F8F5F0;--white:#fff;--border:#F0EDE8;
  --text:#1F2937;--muted:#6B7280;--light:#9CA3AF;
  --ok:#065F46;--ok-bg:#F0FDF4;--err:#DC2626;--err-bg:#FEF2F2;
  --blue:#1D4ED8;--blue-bg:#EFF6FF;--warn:#D97706;--warn-bg:#FFFBEB;
  --black:#1a1708;--nav-h:62px;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;overscroll-behavior:none}
input,select,textarea,button{font-family:inherit;-webkit-appearance:none;appearance:none}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
/* iOS zoom fix */
select,input[type=date],input[type=number],input[type=email],input[type=tel],input[type=text],textarea{font-size:16px!important}

/* LOCK */
#lock{position:fixed;inset:0;background:var(--black);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;padding-top:calc(40px + var(--st));padding-bottom:calc(32px + var(--sb));animation:fi .3s}
#lock.hidden{display:none}
@keyframes fi{from{opacity:0}to{opacity:1}}
.l-logo{width:76px;height:76px;background:linear-gradient(135deg,var(--gold),var(--gold-d));border-radius:22px;display:flex;align-items:center;justify-content:center;margin-bottom:18px;box-shadow:0 8px 32px rgba(201,169,110,.4)}
.l-title{font-size:30px;font-weight:900;color:#fff;letter-spacing:4px;margin-bottom:4px}
.l-sub{font-size:11px;color:rgba(255,255,255,.4);letter-spacing:3px;text-transform:uppercase;margin-bottom:34px}
.l-card{background:rgba(255,255,255,.05);border:1px solid rgba(201,169,110,.2);border-radius:20px;padding:28px 24px;width:320px;max-width:90vw}
.l-lbl{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.4);text-align:center;margin-bottom:14px}
.pdots{display:flex;justify-content:center;gap:12px;margin-bottom:20px;min-height:18px}
.pdot{width:14px;height:14px;border-radius:50%;border:2px solid rgba(201,169,110,.35);background:transparent;transition:all .15s}
.pdot.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 8px rgba(201,169,110,.5)}
.pdot.err{background:var(--err);border-color:var(--err);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.perr{text-align:center;font-size:12px;color:var(--err);min-height:16px;margin-bottom:10px}
.ppad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.pkey{height:58px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(201,169,110,.15);color:#fff;font-size:22px;font-weight:300;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;user-select:none}
.pkey:active{transform:scale(.92);background:rgba(201,169,110,.25)}
.pkey.empty{cursor:default;background:transparent;border:none;pointer-events:none}
.palt{text-align:center;font-size:12px;color:rgba(255,255,255,.3);margin-top:10px;cursor:pointer}
.palt:active{color:var(--gold)}
.patt{text-align:center;font-size:11px;color:rgba(255,255,255,.3);margin-top:8px;min-height:16px}
.ltw{margin-bottom:16px}
.lti{width:100%;padding:14px;background:rgba(255,255,255,.07);border:1px solid rgba(201,169,110,.25);border-radius:12px;color:#fff;font-size:16px!important;text-align:center;letter-spacing:2px;outline:none}
.lti:focus{border-color:var(--gold)}
.lti::placeholder{letter-spacing:0;color:rgba(255,255,255,.25);font-size:13px}
.ltb{width:100%;padding:14px;background:linear-gradient(135deg,var(--gold),var(--gold-d));border:none;border-radius:12px;color:var(--black);font-size:15px;font-weight:700;cursor:pointer;margin-top:8px}
.ltb:active{transform:scale(.97)}
.lfooter{position:absolute;bottom:calc(18px + var(--sb));font-size:10px;color:rgba(255,255,255,.18);letter-spacing:1.5px;text-transform:uppercase;text-align:center}

/* APP */
#app{height:100%;display:flex;flex-direction:column;padding-top:var(--st)}
.hdr{background:var(--white);border-bottom:1px solid var(--border);height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0;box-shadow:0 1px 8px rgba(0,0,0,.05)}
.hlogo{display:flex;align-items:center;gap:9px}
.hicon{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--gold),var(--gold-d));display:flex;align-items:center;justify-content:center}
.hname{font-size:19px;font-weight:900;color:var(--gold-d);letter-spacing:2px}
.hsub{font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
.hbtns{display:flex;gap:4px}
.hbtn{background:none;border:none;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;color:var(--gold-d)}
.hbtn:active{background:var(--gold-bg)}
.main{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 14px calc(var(--nav-h) + var(--sb) + 14px);-webkit-overflow-scrolling:touch}
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--border);display:flex;height:calc(var(--nav-h) + var(--sb));padding-bottom:var(--sb);box-shadow:0 -2px 12px rgba(0,0,0,.06);z-index:100}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:none;cursor:pointer;padding:6px 2px;font-size:10px;font-weight:600;color:var(--light);letter-spacing:.3px}
.ni.on{color:var(--gold-d)}
.niico{font-size:21px;line-height:1;transition:transform .2s}
.ni.on .niico{transform:scale(1.12)}
.nidot{width:5px;height:5px;border-radius:50%;background:var(--gold);display:none}
.ni.on .nidot{display:block}

/* MORE MENU */
.mov{position:fixed;inset:0;z-index:150;display:none}
.mov.on{display:block}
.mmenu{position:fixed;bottom:calc(var(--nav-h) + var(--sb) + 8px);right:8px;background:var(--white);border-radius:16px;box-shadow:0 8px 40px rgba(0,0,0,.18);border:1px solid var(--border);z-index:200;overflow:hidden;min-width:215px;display:none}
.mmenu.on{display:block}
.mitem{display:flex;align-items:center;gap:12px;padding:13px 18px;border:none;background:none;width:100%;text-align:left;cursor:pointer;font-size:15px;font-weight:600;color:var(--text);border-bottom:1px solid var(--border)}
.mitem:last-child{border-bottom:none}
.mitem:active{background:var(--gold-bg)}
.mico{font-size:18px;width:24px;text-align:center}

/* PDF */
#pdfwrap{position:fixed;inset:0;z-index:9500;background:rgba(0,0,0,.93);display:none;flex-direction:column;padding-top:var(--st)}
#pdfwrap.on{display:flex}
.pbar{background:var(--black);padding:11px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-bottom:1px solid rgba(201,169,110,.2);gap:8px}
.pbartitle{color:rgba(255,255,255,.7);font-size:13px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbarbtns{display:flex;gap:6px;flex-shrink:0}
.pbarbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:8px 12px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px;white-space:nowrap}
.pbarbtn:active{background:rgba(255,255,255,.25)}
.pbarbtn.gold{background:linear-gradient(135deg,var(--gold),var(--gold-d));color:var(--black);border:none}
.pscroll{flex:1;overflow-y:auto;padding:20px 12px;display:flex;justify-content:center;-webkit-overflow-scrolling:touch}
.ppage{background:#fff;max-width:720px;width:100%;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.5)}

/* SEND SHEET */
.sndov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9600;display:none;align-items:flex-end;backdrop-filter:blur(3px)}
.sndov.on{display:flex}
.sndsh{background:var(--white);border-radius:24px 24px 0 0;width:100%;padding:20px;padding-bottom:calc(20px + var(--sb));animation:su .3s cubic-bezier(.32,.72,0,1)}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sndhd{width:36px;height:4px;border-radius:2px;background:#D1D5DB;margin:0 auto 16px}
.sndtitle{font-size:17px;font-weight:800;margin-bottom:14px;text-align:center}
.sndbtn{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--border);background:var(--white);width:100%;cursor:pointer;margin-bottom:9px;font-size:14px;font-weight:600;color:var(--text);text-decoration:none}
.sndbtn:active{background:var(--gold-bg)}
.sndico{font-size:26px;width:36px;text-align:center;flex-shrink:0}
.sndsub{font-size:12px;color:var(--muted);font-weight:400;margin-top:1px}

/* CARDS + STATS */
.card{background:var(--white);border-radius:16px;border:1px solid var(--border);padding:16px;box-shadow:0 2px 12px rgba(0,0,0,.04);margin-bottom:12px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--white);border-radius:14px;border:1px solid var(--border);padding:14px;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold-d))}
.slbl{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--light)}
.sval{font-size:22px;font-weight:800;margin-top:5px;line-height:1}
.ssub{font-size:11px;color:var(--light);margin-top:4px}

/* BUTTONS */
.btn{border-radius:11px;font-weight:700;font-size:15px;padding:12px 20px;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:all .15s;-webkit-appearance:none}
.btn:active{opacity:.75;transform:scale(.97)}
.bgold{background:linear-gradient(135deg,var(--gold),var(--gold-d));color:var(--black)}
.bout{background:var(--white);color:var(--gold-d);border:1.5px solid var(--gold)}
.berr{background:var(--err-bg);color:var(--err);border:1.5px solid #FECACA}
.bgh{background:#F3F4F6;color:var(--muted)}
.bsm{font-size:13px;padding:8px 12px;border-radius:9px}
.bfull{width:100%}
.bgrp{display:flex;gap:10px}
.bgrp .btn{flex:1}

/* BADGES */
.badge{display:inline-flex;align-items:center;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700;white-space:nowrap}
.b-devis{background:var(--blue-bg);color:var(--blue)}
.b-facture{background:var(--ok-bg);color:var(--ok)}
.b-avoir{background:#FFF7ED;color:#C2410C}
.b-bc{background:#F5F3FF;color:#7C3AED}
.b-brouillon{background:#F9FAFB;color:#6B7280}
.b-valide{background:var(--ok-bg);color:var(--ok)}
.b-envoye{background:var(--blue-bg);color:var(--blue)}
.b-paye{background:#ECFDF5;color:#065F46}
.b-annule{background:var(--err-bg);color:var(--err)}
.b-partiel{background:var(--warn-bg);color:var(--warn)}

/* SEARCH + TABS */
.sbar{display:flex;align-items:center;gap:9px;background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.sbar input{border:none;outline:none;flex:1;background:transparent;color:var(--text)}
.ftabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.ftabs::-webkit-scrollbar{display:none}
.ftab{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--white);font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.ftab.on{background:var(--gold-d);color:white;border-color:var(--gold-d)}

/* FORMS */
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.fl .req{color:var(--gold)}
.fi,.fs,.fta{border:1.5px solid var(--border);border-radius:10px;padding:11px 13px;color:var(--text);background:var(--white);width:100%;outline:none;transition:border-color .15s}
.fi:focus,.fs:focus,.fta:focus{border-color:var(--gold)}
.fta{resize:vertical;min-height:72px}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* SHEET DRAWER */
.shov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:none;align-items:flex-end;backdrop-filter:blur(2px)}
.shov.on{display:flex}
.sh{background:var(--white);border-radius:24px 24px 0 0;width:100%;max-height:93vh;display:flex;flex-direction:column;padding-bottom:var(--sb);animation:su .3s cubic-bezier(.32,.72,0,1)}
.shhd{width:36px;height:4px;border-radius:2px;background:#D1D5DB;margin:10px auto 0;flex-shrink:0}
.shhdr{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
.shtitle{font-size:17px;font-weight:800}
.shclose{background:#F3F4F6;border:none;border-radius:50%;width:30px;height:30px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.shbody{flex:1;overflow-y:auto;padding:16px 20px;-webkit-overflow-scrolling:touch}
.shfoot{padding:12px 20px;border-top:1px solid var(--border);flex-shrink:0}

/* DOC ITEMS */
.ditem{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border-radius:12px;background:var(--bg);margin-bottom:8px;gap:10px;cursor:pointer;transition:opacity .15s}
.ditem:active{opacity:.7}
.dnum{font-weight:700;font-size:14px;color:var(--gold-d)}
.dcli{font-size:12px;color:var(--muted);margin-top:2px}
.damt{font-weight:800;font-size:16px;text-align:right}
.damt.avoir{color:var(--err)!important}

/* CLIENT CARD */
.clcard{background:var(--bg);border-radius:14px;padding:14px;margin-bottom:10px;border:1px solid var(--border);display:flex;align-items:center;gap:13px}
.clav{width:44px;height:44px;border-radius:13px;flex-shrink:0;background:linear-gradient(135deg,var(--gold),var(--gold-d));display:flex;align-items:center;justify-content:center;color:var(--black);font-weight:800;font-size:17px}
.clinfo{flex:1;min-width:0}
.clname{font-weight:700;font-size:15px}
.cldet{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ARTICLE */
.arow{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
.arow:last-child{border-bottom:none}
.aname{font-weight:700;font-size:15px}
.acat{font-size:11px;color:var(--muted)}

/* TOTAUX */
.totbox{background:var(--gold-bg);border-radius:14px;border:1px solid var(--border);padding:14px;margin-top:12px}
.totrow{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;color:var(--muted)}
.totfin{display:flex;justify-content:space-between;padding:12px 14px;border-radius:10px;background:linear-gradient(135deg,var(--gold-d),var(--gold));color:var(--black);font-weight:800;font-size:18px;margin-top:8px}

/* LIGNE ARTICLE EDITOR */
.ligne-card{background:var(--bg);border-radius:12px;padding:12px;margin-bottom:8px;border:1px solid var(--border)}
.ligne-card.highlight{border-color:var(--gold);background:var(--gold-bg)}

/* CONFIRM + TOAST */
.cnfov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:600;display:none;align-items:center;justify-content:center;padding:20px}
.cnfov.on{display:flex}
.cnfbox{background:var(--white);border-radius:20px;padding:24px;max-width:320px;width:100%;text-align:center}
.cnftitle{font-size:18px;font-weight:800;margin-bottom:8px}
.cnfmsg{font-size:14px;color:var(--muted);margin-bottom:20px;line-height:1.5}
.twrap{position:fixed;bottom:calc(var(--nav-h) + var(--sb) + 10px);left:14px;right:14px;z-index:9999;display:flex;flex-direction:column;gap:7px;pointer-events:none}
.toast{background:var(--black);color:#fff;border-radius:14px;padding:13px 16px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.35);animation:tIn .3s;border-left:3px solid var(--gold)}
.toast.ok{border-left-color:var(--ok)}.toast.err{border-left-color:var(--err)}.toast.warn{border-left-color:var(--warn)}
@keyframes tIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

/* MISC */
.empty{text-align:center;padding:48px 20px;color:var(--light)}
.ibanner{background:var(--gold-bg);border:1px solid var(--gold);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--gold-d);margin-bottom:14px;line-height:1.5}
.okbanner{background:var(--ok-bg);border:1px solid #BBF7D0;border-radius:12px;padding:11px 14px;font-size:13px;color:var(--ok);margin-bottom:14px}
.wbanner{background:var(--warn-bg);border:1px solid #FDE68A;border-radius:12px;padding:11px 14px;font-size:13px;color:var(--warn);margin-bottom:14px}
.seg{display:flex;background:#F3F4F6;border-radius:11px;padding:3px;margin-bottom:14px}
.segb{flex:1;padding:8px;border:none;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);background:none}
.segb.on{background:var(--white);color:var(--gold-d);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.aurow{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
.aurow:last-child{border-bottom:none}
.audot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
.fab{position:fixed;bottom:calc(var(--nav-h) + var(--sb) + 14px);right:16px;width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--gold),var(--gold-d));border:none;cursor:pointer;font-size:26px;box-shadow:0 4px 20px rgba(139,105,20,.45);display:flex;align-items:center;justify-content:center;color:var(--black);z-index:90}
.fab:active{transform:scale(.92)}
/* Quick action tiles */
.qa-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.qa-tile{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:13px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px;transition:all .15s}
.qa-tile:active{background:var(--gold-bg);border-color:var(--gold)}
/* Doc HTML for PDF */
.dinv{font-family:-apple-system,Georgia,sans-serif;padding:28px;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.dbrand{font-size:24px;font-weight:900;color:#1a1708;letter-spacing:3px}
.dtag{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:#C9A96E;margin-top:2px}
.dtype{background:#1a1708;color:#C9A96E;padding:5px 14px;border-radius:4px;font-size:9px;letter-spacing:3px;text-transform:uppercase;font-weight:700;display:inline-block;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.dline{height:2px;background:linear-gradient(90deg,#C9A96E,transparent);margin:18px 0 20px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.dclibox{background:#F8F5F0;border-radius:8px;padding:12px;border-left:3px solid #C9A96E;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.dclibox h4{font-size:8px;letter-spacing:2px;text-transform:uppercase;color:#8B6914;margin-bottom:6px;font-weight:700}
.dtbl{width:100%;border-collapse:collapse;margin-bottom:18px}
.dtbl th{background:#1a1708;color:#e8d5a3;padding:8px 10px;font-size:9px;letter-spacing:1px;text-transform:uppercase;font-weight:600;-webkit-print-color-adjust:exact;print-color-adjust:exact}

<body>

<!-- LOCK -->
<div id="lock">
  <div class="l-logo"><svg width="44" height="44" viewBox="0 0 50 50" fill="none"><path d="M25 6L28.5 18L41 14.5L33 24L39 37L25 31L11 37L17 24L9 14.5L21.5 18Z" fill="white" opacity=".95"/><circle cx="25" cy="25" r="6" fill="rgba(255,255,255,.65)"/></svg></div>

    <div class="pdots" id="pdots"><div class="pdot" id="pd0"></div><div class="pdot" id="pd1"></div><div class="pdot" id="pd2"></div><div class="pdot" id="pd3"></div><div class="pdot" id="pd4"></div><div class="pdot" id="pd5"></div></div>

<!-- APP -->
<div id="app" style="display:none">
  <div class="hdr">
    <div class="hlogo">
      <div class="hicon"><svg width="20" height="20" viewBox="0 0 50 50" fill="none"><path d="M25 6L28.5 18L41 14.5L33 24L39 37L25 31L11 37L17 24L9 14.5L21.5 18Z" fill="white" opacity=".95"/><circle cx="25" cy="25" r="5" fill="rgba(255,255,255,.7)"/></svg></div>

    <button class="ni" data-p="docs" onclick="go('docs')"><span class="niico">📄</span><span>Documents</span><span class="nidot"></span></button>

    <button class="mitem" onclick="CM();openNewDoc('avoir')"><span class="mico">↩️</span>Nouvel Avoir</button>

    <button class="mitem" onclick="CM();exportData()"><span class="mico">💾</span>Exporter backup</button>
    <button class="mitem" onclick="CM();importData()"><span class="mico">📥</span>Importer backup</button>

</div>

<!-- PDF VIEWER -->

  <div class="pbar">
    <div class="pbartitle" id="pdflbl">Document</div>
    <div class="pbarbtns">
      <button class="pbarbtn" onclick="sendDoc()">📤 Envoyer</button>
      <button class="pbarbtn gold" onclick="printDoc()">🖨️ Imprimer</button>

<!-- SEND SHEET -->

  <div class="sndsh">
    <div class="sndhd"></div>
    <div class="sndtitle" id="sndtitle">Envoyer</div>
    <div id="sndbodies"></div>
    <button class="btn bgh bfull" onclick="CS()" style="margin-top:4px">Fermer</button>

<!-- SHEETS -->
<div class="shov" id="sh-doc"><div class="sh"><div class="shhd"></div><div class="shhdr"><span class="shtitle" id="sh-doc-title">Document</span><button class="shclose" onclick="SS('sh-doc')">×</button></div><div class="shbody" id="sh-doc-body"></div><div class="shfoot" id="sh-doc-foot"></div></div></div>

<div class="shov" id="sh-art"><div class="sh"><div class="shhd"></div><div class="shhdr"><span class="shtitle" id="sh-art-title">Article</span><button class="shclose" onclick="SS('sh-art')">×</button></div><div class="shbody" id="sh-art-body"></div><div class="shfoot"><div class="bgrp"><button class="btn bgh" onclick="SS('sh-art')">Annuler</button><button class="btn bgold" onclick="saveArt()">💾 Enregistrer</button></div></div></div></div>

<div class="cnfov" id="cnfov"><div class="cnfbox"><div class="cnftitle" id="cnftitle">Confirmer</div><div class="cnfmsg" id="cnfmsg"></div><div class="bgrp"><button class="btn bgh" onclick="CC()">Annuler</button><button class="btn berr" id="cnfok">Confirmer</button></div></div></div>

<input type="file" id="fimport" accept=".json" style="display:none" onchange="doImport(event)">

<script>
'use strict';

// ════════════════════════════════════════════
// SÉCURITÉ — SHA-256 + PIN + SESSION
// ════════════════════════════════════════════
const DPH='03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4'; // 1234
const DRH='e30f4a7dc019fe6d820fac85379e23806e272d6e52f9e697578f1000a00d5c7f'; // SORA2024
const SES_DUR=8*60*60*1000,MAX_ATT=5,LOCK_DUR=5*60*1000;
let _pb='',_lmode='pin',_sa=false;

async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
const gSec=()=>{try{return JSON.parse(localStorage.getItem('sr_sec')||'{}');}catch{return{};}};
const sSec=d=>{try{localStorage.setItem('sr_sec',JSON.stringify(d));}catch{}};
const gSes=()=>{try{return JSON.parse(sessionStorage.getItem('sr_ses')||'{}');}catch{return{};}};
const sSes=d=>{try{sessionStorage.setItem('sr_ses',JSON.stringify(d));}catch{}};
function sesOk(){const s=gSes();if(!s.ok||!s.exp)return false;if(Date.now()>s.exp){sessionStorage.removeItem('sr_ses');return false;}return true;}
function mkSes(){sSes({ok:true,exp:Date.now()+SES_DUR});_sa=true;}
async function vPin(inp){const sec=gSec();const h=await sha256(inp);const r=sec.rh||DRH;if(h===r)return{ok:true,rec:true};return{ok:h===(sec.ph||DPH),rec:false};}
function gAtt(){const s=gSec();const lu=s.lu||0;if(Date.now()<lu)return{locked:true,rem:Math.ceil((lu-Date.now())/1000),cnt:s.att||0};return{locked:false,cnt:s.att||0};}
function iAtt(){const s=gSec();s.att=(s.att||0)+1;if(s.att>=MAX_ATT){s.lu=Date.now()+LOCK_DUR;s.att=0;}sSec(s);}
function rAtt(){const s=gSec();s.att=0;s.lu=0;sSec(s);}
function updDots(){document.querySelectorAll('.pdot').forEach((d,i)=>{d.classList.toggle('on',i<_pb.length);d.classList.remove('err');});}
function errDots(){document.querySelectorAll('.pdot').forEach(d=>{d.classList.add('err');d.classList.remove('on');});setTimeout(()=>{_pb='';updDots();},500);}
function updAttUI(){const a=gAtt();const el=document.getElementById('patt');if(!el)return;if(a.locked){el.textContent='🔒 Bloqué temporairement';el.style.color='var(--err)';const t=setInterval(()=>{const a2=gAtt();if(!a2.locked){clearInterval(t);el.textContent='';el.style.color='';return;}el.textContent=`🔒 Encore ${a2.rem}s`;},1000);}else if(a.cnt>0){el.textContent=`${a.cnt} tentative(s) échouée(s)`;el.style.color='var(--warn)';}}
function PK(k){const a=gAtt();if(a.locked){updAttUI();return;}if(_pb.length>=6)return;_pb+=k;updDots();const sec=gSec();const pl=sec.pl||4;if(_pb.length>=pl&&_pb.length>=4)setTimeout(subPin,150);}
function PD(){if(_pb.length>0){_pb=_pb.slice(0,-1);updDots();}}
async function subPin(){const inp=_pb;_pb='';updDots();const a=gAtt();if(a.locked){document.getElementById('perr').textContent=`Bloqué ${a.rem}s`;return;}const r=await vPin(inp);if(r.ok){rAtt();mkSes();unlock(r.rec);}else{iAtt();errDots();const a2=gAtt();document.getElementById('perr').textContent=a2.locked?'Trop de tentatives — 5 min':`Incorrect — ${MAX_ATT-a2.cnt} essai(s)`;updAttUI();}}
function TLM(){_lmode=_lmode==='pin'?'text':'pin';_pb='';updDots();document.getElementById('perr').textContent='';const pad=document.querySelector('.ppad'),dots=document.getElementById('pdots'),lbl=document.getElementById('palt');if(_lmode==='text'){pad.style.display='none';dots.style.display='none';document.getElementById('llbl').textContent='Mot de passe';lbl.textContent='Utiliser le code PIN';let w=document.getElementById('ltw');if(!w){w=document.createElement('div');w.id='ltw';w.className='ltw';w.innerHTML=`<input type="password" class="lti" id="lti" placeholder="Votre mot de passe…" onkeydown="if(event.key==='Enter')subPwd()"><button class="ltb" onclick="subPwd()">Déverrouiller →</button>`;dots.parentNode.insertBefore(w,dots.nextSibling);setTimeout(()=>document.getElementById('lti')?.focus(),100);}w.style.display='';}else{pad.style.display='';dots.style.display='';document.getElementById('llbl').textContent='Code PIN';lbl.textContent='Utiliser le mot de passe texte';const w=document.getElementById('ltw');if(w)w.style.display='none';}}
async function subPwd(){const inp=document.getElementById('lti')?.value||'';if(!inp){document.getElementById('perr').textContent='Saisissez votre mot de passe';return;}const a=gAtt();if(a.locked){document.getElementById('perr').textContent=`Bloqué ${a.rem}s`;return;}const r=await vPin(inp);if(r.ok){rAtt();mkSes();unlock(r.rec);}else{iAtt();const a2=gAtt();document.getElementById('perr').textContent=a2.locked?'Trop de tentatives.':`Incorrect — ${MAX_ATT-a2.cnt} essai(s)`;if(document.getElementById('lti'))document.getElementById('lti').value='';updAttUI();}}
function unlock(isRec=false){document.getElementById('lock').classList.add('hidden');document.getElementById('app').style.display='flex';_sa=true;render();if(isRec)setTimeout(()=>toast('⚠️ Code de récupération utilisé — Changez votre mot de passe','warn',5000),600);}
function lockApp(){cnf('Verrouiller SORA ?','Vous devrez saisir votre code PIN.',()=>{sessionStorage.removeItem('sr_ses');_sa=false;_pb='';document.getElementById('perr').textContent='';document.getElementById('patt').textContent='';if(_lmode==='text')TLM();updDots();document.getElementById('lock').classList.remove('hidden');document.getElementById('app').style.display='none';closePDF();});}
function chkLock(){if(sesOk()){_sa=true;document.getElementById('lock').classList.add('hidden');document.getElementById('app').style.display='flex';return true;}document.getElementById('app').style.display='none';updAttUI();return false;}

// ════════════════════════════════════════════
// DB
// ════════════════════════════════════════════
const ARTS0=[
  {id:1,nom:'Drap',prix:40,unite:'pièce',categorie:'Literie'},
  {id:2,nom:'Foulard',prix:10,unite:'pièce',categorie:'Accessoires'},
  {id:3,nom:'Rideaux',prix:30,unite:'pièce',categorie:'Décoration'},
  {id:4,nom:'Bazin',prix:50,unite:'mètre',categorie:'Tissu'},
  {id:5,nom:'Brodé',prix:30,unite:'pièce',categorie:'Tissu'},
  {id:6,nom:'Robe Khaska',prix:25,unite:'pièce',categorie:'Vêtement'},
  {id:7,nom:'Parfum',prix:10,unite:'flacon',categorie:'Beauté'},
];
const CFG0={nom:'SORA',exp:'',adr:'',cp:'',vil:'',email:'',tel:'',wa:'',siret:'',tvaIntra:'',tvaMod:'franchise',tvaDef:0,cond:'Paiement à réception de facture.',pfxD:'DEV-',pfxF:'FAC-',mentions:''};
function lDB(){try{const r=localStorage.getItem('sr_db');if(r){const d=JSON.parse(r);if(!d.arts||!d.arts.length)d.arts=[...ARTS0];if(!d.cfg)d.cfg={...CFG0};if(!d.audit)d.audit=[];if(!d.ctr)d.ctr={d:1,f:1};Object.keys(CFG0).forEach(k=>{if(d.cfg[k]===undefined)d.cfg[k]=CFG0[k];});return d;}}catch(e){console.warn(e);}return{docs:[],cls:[],arts:[...ARTS0],cfg:{...CFG0},audit:[],ctr:{d:1,f:1}};}
function sDB(){try{localStorage.setItem('sr_db',JSON.stringify(db));}catch{toast('Erreur sauvegarde','err');}}
let db=lDB();
function log(msg,type='gen',det=''){if(!db.audit)db.audit=[];db.audit.unshift({id:Date.now()+Math.random(),msg,type,det,dt:new Date().toISOString(),usr:db.cfg.exp||db.cfg.nom||'SORA'});if(db.audit.length>500)db.audit.pop();}

// ════════════════════════════════════════════
// UTILS
// ════════════════════════════════════════════
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const v=id=>{const e=document.getElementById(id);return e?e.value:'';};
const num=x=>isNaN(parseFloat(x))?0:parseFloat(x);
function today(){return new Date().toISOString().slice(0,10);}
function fD(d){if(!d||d==='—')return'—';try{const[y,m,dd]=d.slice(0,10).split('-').map(Number);return new Date(y,m-1,dd).toLocaleDateString('fr-FR');}catch{return d;}}
function fM(n){return Number(n||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';}
function genId(pfx){const n=new Date(),y=n.getFullYear(),m=String(n.getMonth()+1).padStart(2,'0');return`${pfx}${y}${m}-${String(Math.floor(Math.random()*9000)+1000)}`;}
function isFranchise(){return db.cfg.tvaMod==='franchise';}
function calcDoc(d){const l=d.lignes||[];const st=l.reduce((s,l)=>{const pu=l.pu??l.prixUnit??0,q=l.q??l.qte??0,rem=l.rem??l.remise??0;const b=pu*q;return s+b-b*(rem/100);},0);const rg=st*((d.remGlob??d.remiseGlobale??0)/100);const ht=st-rg;const tva=ht*((d.tva||0)/100);return{st,rg,ht,tva,ttc:ht+tva};}
function dTotal(d){const t=calcDoc(d);return isFranchise()?t.ht:t.ttc;}
function dNum(d){return d.num||d.numero||'—';}
function badge(t){const M={devis:'b-devis',facture:'b-facture',avoir:'b-avoir','bon-commande':'b-bc',brouillon:'b-brouillon',valide:'b-valide',envoye:'b-envoye',paye:'b-paye',annule:'b-annule',partiel:'b-partiel'};const L={devis:'Devis',facture:'Facture',avoir:'Avoir','bon-commande':'BC',brouillon:'Brouillon',valide:'Validé',envoye:'Envoyé',paye:'Payé',annule:'Annulé',partiel:'Partiel'};return`<span class="badge ${M[t]||'b-brouillon'}">${L[t]||t}</span>`;}
function clName(id){const c=db.cls.find(x=>x.id==id);return c?esc(c.nom):'—';}

// ════════════════════════════════════════════
// NAV
// ════════════════════════════════════════════
let P='dash',dtf='tous',sq='';
function go(p){P=p;sq='';document.querySelectorAll('.ni').forEach(b=>b.classList.toggle('on',b.dataset.p===p||(p==='params'&&b.dataset.p==='more')||(p==='audit'&&b.dataset.p==='more')));render();}
function render(){const mc=document.getElementById('mc');const fns={dash:rDash,docs:rDocs,clients:rCls,articles:rArts,params:rParams,audit:rAudit};(fns[P]||rDash)(mc);const si=document.getElementById('si');if(si){si.value=sq;si.addEventListener('input',()=>{sq=si.value;render();});}}
function TM(){document.getElementById('mmenu').classList.toggle('on');document.getElementById('mov').classList.toggle('on');}
function CM(){document.getElementById('mmenu').classList.remove('on');document.getElementById('mov').classList.remove('on');}

// ════════════════════════════════════════════
// DASHBOARD
// ════════════════════════════════════════════
function rDash(mc){
  const facs=db.docs.filter(d=>d.type==='facture'),devs=db.docs.filter(d=>d.type==='devis');
  const ca=facs.filter(d=>(d.st||d.statut)==='paye').reduce((s,d)=>s+dTotal(d),0);
  const att=facs.filter(d=>['valide','envoye'].includes(d.st||d.statut)).reduce((s,d)=>s+dTotal(d),0);
  const recent=[...db.docs].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,6);
  const cfg=db.cfg,ns=!cfg.exp||!cfg.siret;
  mc.innerHTML=`
  ${ns?`<div class="ibanner" onclick="go('params')" style="cursor:pointer">⚠️ <strong>Configuration requise</strong> — Renseignez nom, SIRET pour des documents conformes. <span style="font-weight:700;text-decoration:underline">Configurer →</span></div>`:''}
  <div style="font-size:22px;font-weight:800;margin-bottom:14px">Bonjour 👋<br><span style="color:var(--gold-d)">${esc(cfg.exp||cfg.nom||'SORA')}</span></div>
  <div class="sgrid">
    <div class="stat"><div class="slbl">CA encaissé</div><div class="sval" style="color:var(--ok)">${fM(ca)}</div><div class="ssub">${facs.filter(d=>(d.st||d.statut)==='paye').length} facture(s)</div></div>
    <div class="stat"><div class="slbl">En attente</div><div class="sval" style="color:var(--warn)">${fM(att)}</div><div class="ssub">${facs.filter(d=>['valide','envoye'].includes(d.st||d.statut)).length} facture(s)</div></div>
    <div class="stat"><div class="slbl">Devis ouverts</div><div class="sval" style="color:var(--blue)">${devs.filter(d=>!['annule'].includes(d.st||d.statut)).length}</div><div class="ssub">${devs.length} au total</div></div>
    <div class="stat"><div class="slbl">Clients</div><div class="sval" style="color:#7C3AED">${db.cls.length}</div><div class="ssub">enregistrés</div></div>
  </div>
  <div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">Créer rapidement</div>
  <div class="qa-grid">
    ${[['📋','Devis','devis'],['🧾','Facture','facture'],['↩️','Avoir','avoir'],['📦','Bon de cmd','bon-commande']].map(([ic,lb,tp])=>`<button class="qa-tile" onclick="openNewDoc('${tp}')"><span style="font-size:26px">${ic}</span><span style="font-size:11px;font-weight:700;color:var(--gold-d);text-transform:uppercase;letter-spacing:.5px">Nouveau</span><span style="font-size:14px;font-weight:800;color:var(--text)">${lb}</span></button>`).join('')}
  </div>
  ${recent.length?`<div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">Documents récents</div>

async function chgPIN(){const cur=v('sc-cur'),nw=v('sc-new'),cf=v('sc-conf');if(!cur){toast('Entrez le mot de passe actuel','warn');return;}if(!nw||nw.length<4){toast('4 caractères minimum','warn');return;}if(nw!==cf){toast('Les mots de passe ne correspondent pas','err');return;}const ch=await sha256(cur),sec=gSec(),st=sec.ph||DPH,rh=sec.rh||DRH;if(ch!==st&&ch!==rh){toast('Mot de passe actuel incorrect','err');return;}const nh=await sha256(nw);sec.ph=nh;sec.pl=nw.length;sSec(sec);log('Mot de passe modifié','security','SHA-256');sDB();SS('sh-sec');toast('Mot de passe mis à jour ✓','ok');}

function buildTotaux(){
  const d=cDoc,t=calcDoc(d),fr=isFranchise(),isAv=d.type==='avoir';
  return`${d.remGlob>0?`<div class="totrow"><span>Sous-total</span><span>${fM(t.st)}</span></div><div class="totrow" style="color:var(--err)"><span>Remise globale (${d.remGlob}%)</span><span>−${fM(t.rg)}</span></div>`:`<div class="totrow"><span>Sous-total</span><span>${fM(t.st)}</span></div>`}
  ${!fr?`<div class="totrow"><span>Total HT</span><span>${fM(t.ht)}</span></div><div class="totrow"><span>TVA ${d.tva}%</span><span>${fM(t.tva)}</span></div>`:''}
  <div class="totfin"><span>${fr?'TOTAL NET':'TOTAL TTC'}</span><span>${fM(fr?t.ht:t.ttc)}</span></div>
  ${fr?`<div style="text-align:right;font-size:11px;color:var(--muted);margin-top:5px;font-style:italic">TVA non applicable — art. 293 B du CGI</div>`:''}`;
}

// Refresh uniquement la zone totaux (pas de rebuild complet → pas de perte de focus)
function refreshTotaux(){
  const tb=document.getElementById('totbox');
  if(tb)tb.innerHTML=buildTotaux();
  // Mettre à jour les sous-totaux de chaque ligne via data-tot attribute
  cDoc.lignes.forEach((l,i)=>{
    const el=document.querySelector(`[data-tot="${i}"]`);
    const pu=l.pu??l.prixUnit??0,q=l.q??l.qte??0,rem=l.rem??l.remise??0;
    if(el){const tot=pu*q*(1-rem/100);el.textContent=`= ${fM(tot)}`;}
  });
}

function onArtSel(i,id){
  if(id==='__libre'||!id){cDoc.lignes[i].artId='';return;}
  const a=db.arts.find(x=>String(x.id)===String(id));
  if(a){cDoc.lignes[i]={...cDoc.lignes[i],artId:a.id,desc:a.nom,pu:cDoc.type==='avoir'?-a.prix:a.prix,q:cDoc.lignes[i].q||1,rem:cDoc.lignes[i].rem||0,unite:a.unite};buildDocSheet();}
}

function addLigne(){cDoc.lignes.push({artId:'',desc:'',q:1,pu:0,rem:0,unite:'pièce'});buildDocSheet();}
function rmLigne(i){cDoc.lignes.splice(i,1);buildDocSheet();}

function saveDoc(){
  const d=cDoc;
  if(!d.num||!d.date){toast('Numéro et date requis','err');return;}
  const tl={devis:'Devis',facture:'Facture',avoir:'Avoir','bon-commande':'Bon de commande'};
  const cl=db.cls.find(c=>String(c.id)===String(d.clId));
  const total=fM(dTotal(d));
  if(d.id){
    const idx=db.docs.findIndex(x=>x.id===d.id);
    if(idx>=0)db.docs[idx]=d;
    log(`${tl[d.type]} modifié : ${d.num}`,d.type,`Client:${cl?.nom||'—'}, Montant:${total}`);
    toast('Document mis à jour ✓','ok');
  }else{
    d.id=Date.now();
    db.docs.push(d);
    log(`${tl[d.type]} créé : ${d.num}`,d.type,`Client:${cl?.nom||'—'}, Montant:${total}`);
    toast('Document créé ✓','ok');
  }
  sDB();SS('sh-doc');render();
}

function openSend(id){
  const d=db.docs.find(x=>x.id===id);if(!d)return;
  const clid=d.clId||d.clientId||'';
  const cl=db.cls.find(c=>String(c.id)===String(clid));
  const cfg=db.cfg,t=calcDoc(d),fr=isFranchise();
  const TL={devis:'Devis',facture:'Facture',avoir:'Avoir','bon-commande':'Bon de commande'};
  const total=fM(fr?t.ht:t.ttc);
  const num=dNum(d);
  const txt=[
    '━━━━━━━━━━━━━━━━━━━',`✨ ${cfg.nom||'SORA'} — ${cfg.exp||''} (EI)`,'━━━━━━━━━━━━━━━━━━━',
    `📄 ${TL[d.type]} N° ${num}`,`📅 Date : ${fD(d.date)}`,
    (d.ech||d.dateEcheance)?`⏰ Échéance : ${fD(d.ech||d.dateEcheance)}`:'',
    cl?`👤 ${cl.nom}`:'','',
    ...(d.lignes||[]).map(l=>{const pu=l.pu??l.prixUnit??0,q=l.q??l.qte??0,rem=l.rem??l.remise??0;const desc=l.desc||l.designation||'?';return`• ${desc} — ${q}×${fM(pu)} = ${fM(pu*q*(1-rem/100))}`;}),
    '',`💰 ${fr?'TOTAL':'TOTAL TTC'} : ${total}`,
    fr?'(TVA non applicable — art. 293 B du CGI)':`(TVA ${d.tva}% : ${fM(t.tva)})`,
    '',d.notes?`📋 ${d.notes}`:'',cfg.siret?`SIRET : ${cfg.siret}`:'',
  ].filter(x=>x!=='').join('\n');

  document.getElementById('sndtitle').textContent=`📤 Envoyer — ${num}`;
  let btns='';
  const clEmail=cl?.email||'';
  if(clEmail){
    const subj=encodeURIComponent(`${TL[d.type]} ${num} — ${cfg.nom||'SORA'}`);
    const body=encodeURIComponent(`Bonjour ${cl.nom},\n\nVeuillez trouver votre ${TL[d.type].toLowerCase()} n° ${num}.\n\nMontant : ${total}\n\nCordialement,\n${cfg.exp||cfg.nom||'SORA'}${cfg.tel?'\n'+cfg.tel:''}`);
    btns+=`<a href="mailto:${clEmail}?subject=${subj}&body=${body}" class="sndbtn" onclick="CS()"><span class="sndico">📧</span><div><div>Email</div><div class="sndsub">${esc(clEmail)}</div></div></a>`;
  }else{
    btns+=`<div class="sndbtn" style="opacity:.4;cursor:default"><span class="sndico">📧</span><div><div>Email</div><div class="sndsub">Aucun email client enregistré</div></div></div>`;
  }
  const wa=(cl?.tel||cfg.wa||'').replace(/[^0-9+]/g,'').replace(/^\+/,'');
  if(wa){btns+=`<a href="https://wa.me/${wa}?text=${encodeURIComponent(txt)}" target="_blank" class="sndbtn" onclick="CS()"><span class="sndico">💬</span><div><div>WhatsApp</div><div class="sndsub">${esc(cl?.tel||cfg.wa||wa)}</div></div></a>`;}
  if(navigator.share){btns+=`<button class="sndbtn" onclick="nShare('${esc(num)}','${encodeURIComponent(txt)}')"><span class="sndico">📱</span><div><div>Partager…</div><div class="sndsub">SMS, AirDrop, Mail…</div></div></button>`;}
  btns+=`<button class="sndbtn" onclick="cpTxt('${encodeURIComponent(txt)}')"><span class="sndico">📋</span><div><div>Copier le texte</div><div class="sndsub">Presse-papier</div></div></button>`;
  btns+=`<button class="sndbtn" onclick="CS();if(_pdfId===null){showPDF(${id});}printDoc()"><span class="sndico">🖨️</span><div><div>Imprimer / PDF</div><div class="sndsub">Via l'impression du navigateur</div></div></button>`;
  document.getElementById('sndbodies').innerHTML=btns;
  document.getElementById('sndov').classList.add('on');
}
function CS(){document.getElementById('sndov').classList.remove('on');}
function nShare(title,enc){if(navigator.share)navigator.share({title,text:decodeURIComponent(enc)}).catch(()=>{});CS();}
function cpTxt(enc){navigator.clipboard?.writeText(decodeURIComponent(enc)).then(()=>{toast('Copié ✓','ok');CS();}).catch(()=>toast('Copie non disponible','warn'));}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePDF();CS();}});

function newCl(){_eCl=null;document.getElementById('sh-cl-title').textContent='Nouveau Client';document.getElementById('sh-cl-body').innerHTML=clForm({});window._qlCb=false;OS('sh-cl');}
function editCl(id){_eCl=id;const c=db.cls.find(x=>x.id===id);if(!c)return;document.getElementById('sh-cl-title').textContent='Modifier le Client';document.getElementById('sh-cl-body').innerHTML=clForm(c);window._qlCb=false;OS('sh-cl');}
function clForm(c){return`<div class="fg"><label class="fl">Nom / Prénom <span class="req">*</span></label><input class="fi" id="cl-n" value="${esc(c.nom||'')}" placeholder="Prénom Nom"></div><div class="fg"><label class="fl">Entreprise</label><input class="fi" id="cl-e" value="${esc(c.ent||'')}"></div><div class="fr2"><div class="fg"><label class="fl">Email</label><input class="fi" type="email" id="cl-em" value="${esc(c.email||'')}"></div><div class="fg"><label class="fl">Téléphone</label><input class="fi" type="tel" id="cl-t" value="${esc(c.tel||'')}"></div></div><div class="fg"><label class="fl">Adresse</label><textarea class="fta" id="cl-a" rows="2">${esc(c.adr||'')}</textarea></div><div class="fr2"><div class="fg"><label class="fl">CP</label><input class="fi" id="cl-cp" value="${esc(c.cp||'')}"></div><div class="fg"><label class="fl">Ville</label><input class="fi" id="cl-v" value="${esc(c.vil||'')}"></div></div><div class="fg"><label class="fl">SIRET client</label><input class="fi" id="cl-s" value="${esc(c.siret||'')}"></div><div class="fg"><label class="fl">Notes</label><textarea class="fta" id="cl-no" rows="2">${esc(c.notes||'')}</textarea></div>`;}
function saveCl(){
  const nom=v('cl-n');if(!nom){toast('Le nom est requis','err');return;}
  const cl={nom,ent:v('cl-e'),email:v('cl-em'),tel:v('cl-t'),adr:v('cl-a'),cp:v('cl-cp'),vil:v('cl-v'),siret:v('cl-s'),notes:v('cl-no')};
  if(_eCl){const idx=db.cls.findIndex(c=>c.id===_eCl);if(idx>=0)db.cls[idx]={...db.cls[idx],...cl};log(`Client modifié : ${cl.nom}`,'client');toast('Client mis à jour ✓','ok');}
  else{cl.id=Date.now();db.cls.push(cl);log(`Nouveau client : ${cl.nom}`,'client',`Email:${cl.email||'—'}`);toast('Client ajouté ✓','ok');}
  sDB();
  if(window._qlCb){
    // Retour vers le formulaire doc : mettre à jour le select client
    window._qlCb=false;SS('sh-cl');
    // Reconstruire le sélecteur client dans le doc
    const sel=document.getElementById('d-cl');
    if(sel){const opt=document.createElement('option');opt.value=cl.id;opt.textContent=esc(cl.nom);sel.appendChild(opt);sel.value=cl.id;cDoc.clId=String(cl.id);}
  }else{SS('sh-cl');render();}
}
function delCl(id){cnf('Supprimer ce client ?','Cette action est irréversible.',()=>{const c=db.cls.find(x=>x.id===id);if(c)log(`Client supprimé : ${c.nom}`,'suppression');db.cls=db.cls.filter(x=>x.id!==id);sDB();toast('Client supprimé','err');render();});}

let _eArt=null;
function newArt(){_eArt=null;document.getElementById('sh-art-title').textContent='Nouvel Article';document.getElementById('sh-art-body').innerHTML=artForm({});OS('sh-art');}
function editArt(id){_eArt=id;const a=db.arts.find(x=>x.id===id);if(!a)return;document.getElementById('sh-art-title').textContent="Modifier l'Article";document.getElementById('sh-art-body').innerHTML=artForm(a);OS('sh-art');}
function artForm(a){const cats=['Literie','Accessoires','Décoration','Tissu','Vêtement','Beauté','Autre'];return`<div class="fg"><label class="fl">Nom <span class="req">*</span></label><input class="fi" id="ar-n" value="${esc(a.nom||'')}" placeholder="Ex: Drap, Foulard…"></div><div class="fr2"><div class="fg"><label class="fl">Prix (€) <span class="req">*</span></label><input class="fi" type="number" id="ar-p" value="${num(a.prix)||''}" min="0" step="0.01" placeholder="0.00"></div><div class="fg"><label class="fl">Unité</label><input class="fi" id="ar-u" value="${esc(a.unite||'pièce')}"></div></div><div class="fg"><label class="fl">Catégorie</label><select class="fs" id="ar-c">${cats.map(c=>`<option value="${c}" ${(a.categorie||'Autre')===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="fg"><label class="fl">Description</label><textarea class="fta" id="ar-d" rows="2">${esc(a.description||'')}</textarea></div>`;}
function saveArt(){
  const nom=v('ar-n'),prix=num(v('ar-p'));
  if(!nom){toast('Le nom est requis','err');return;}
  if(prix<0){toast('Le prix doit être ≥ 0','err');return;}
  // Fix: allow prix=0 (gratuit)
  const a={nom,prix,unite:v('ar-u')||'pièce',categorie:v('ar-c')||'Autre',description:v('ar-d')};
  if(_eArt){const idx=db.arts.findIndex(x=>x.id===_eArt);if(idx>=0)db.arts[idx]={...db.arts[idx],...a};log(`Article modifié : ${a.nom}`,'art',`Prix:${fM(a.prix)}`);toast('Article mis à jour ✓','ok');}
  else{a.id=Date.now();db.arts.push(a);log(`Article créé : ${a.nom}`,'art',`Prix:${fM(a.prix)}`);toast('Article ajouté ✓','ok');}
  sDB();SS('sh-art');render();
}
function delArt(id){cnf('Supprimer cet article ?','Cette action est irréversible.',()=>{const a=db.arts.find(x=>x.id===id);if(a)log(`Article supprimé : ${a.nom}`,'suppression');db.arts=db.arts.filter(x=>x.id!==id);sDB();toast('Article supprimé','err');render();});}
function delDoc(id){cnf('Supprimer ce document ?','Cette action est irréversible.',()=>{const d=db.docs.find(x=>x.id===id);if(d)log(`Document supprimé : ${d.num}`,'suppression');db.docs=db.docs.filter(x=>x.id!==id);sDB();toast('Document supprimé','err');render();});}

// CONFIRM

let _ccb=null;
function cnf(title,msg,cb){document.getElementById('cnftitle').textContent=title;document.getElementById('cnfmsg').textContent=msg;_ccb=cb;document.getElementById('cnfok').onclick=()=>{if(_ccb){_ccb();_ccb=null;}document.getElementById('cnfov').classList.remove('on');};document.getElementById('cnfov').classList.add('on');}
function CC(){_ccb=null;document.getElementById('cnfov').classList.remove('on');}

// ════════════════════════════════════════════
// EXPORT / IMPORT
// ════════════════════════════════════════════
function exportData(){const bl=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=`sora-backup-${today()}.json`;a.click();log('Export JSON','settings',`${db.docs.length} docs, ${db.cls.length} clients`);toast('Backup exporté ✓','ok');}
function importData(){document.getElementById('fimport').click();}
function doImport(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const data=JSON.parse(ev.target.result);if(data.docs!==undefined&&data.cls!==undefined){cnf('Remplacer toutes les données ?','Vos données actuelles seront remplacées par le backup.',()=>{db=data;if(!db.audit)db.audit=[];if(!db.cfg)db.cfg={...CFG0};if(!db.arts||!db.arts.length)db.arts=[...ARTS0];Object.keys(CFG0).forEach(k=>{if(db.cfg[k]===undefined)db.cfg[k]=CFG0[k];});log('Import JSON','settings','Backup importé');sDB();render();toast('Données restaurées ✓','ok');});}else toast('Fichier backup invalide','err');}catch{toast('Erreur lecture fichier','err');}};r.readAsText(f);e.target.value='';}

// ════════════════════════════════════════════
// SHEETS
// ════════════════════════════════════════════
function OS(id){document.getElementById(id).classList.add('on');}
function SS(id){document.getElementById(id).classList.remove('on');}

// ════════════════════════════════════════════
// TOAST
// ════════════════════════════════════════════
function toast(msg,type='ok',dur=3200){const ic={ok:'✓',err:'✗',warn:'⚠️'};const el=document.createElement('div');el.className=`toast ${type}`;el.innerHTML=`<span>${ic[type]||'ℹ️'}</span><span>${esc(msg)}</span>`;const w=document.getElementById('twrap');w.appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transform='translateY(10px)';el.style.transition='all .3s';setTimeout(()=>el.remove(),300);},dur);}

// ════════════════════════════════════════════
// SERVICE WORKER
// ════════════════════════════════════════════
if('serviceWorker' in navigator){const sw=`const C='sora-v4';self.addEventListener('install',e=>e.waitUntil(caches.open(C).then(c=>c.addAll([location.pathname]))));self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{const cl=res.clone();caches.open(C).then(c=>c.put(e.request,cl));return res;}))));`;const bl=new Blob([sw],{type:'application/javascript'});navigator.serviceWorker.register(URL.createObjectURL(bl)).catch(()=>{});}
